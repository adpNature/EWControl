version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      typescript:
        patterns:
          - typescript
          - "@types/node"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      typescript:
        patterns:
          - typescript
          - "@types/node"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
