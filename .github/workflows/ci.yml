name: CI

on:
  pull_request:
    branches: [main]

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ewcontrol
          POSTGRES_PASSWORD: ewcontrol_ci
          POSTGRES_DB: ewcontrol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ewcontrol -d ewcontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      influxdb:
        image: influxdb:2.7-alpine
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: ci
          DOCKER_INFLUXDB_INIT_PASSWORD: ewcontrol_ci_local_only
          DOCKER_INFLUXDB_INIT_ORG: ewcontrol
          DOCKER_INFLUXDB_INIT_BUCKET: signals_history
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ewcontrol-ci-admin-token
        ports:
          - 8086:8086
        options: >-
          --health-cmd "influx ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Captura de correo para el test de integración del Notification Service
      # (docs/specs/09-alarmas.md); la imagen trae su propio healthcheck.
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ewcontrol
      POSTGRES_USER: ewcontrol
      POSTGRES_PASSWORD: ewcontrol_ci
      INFLUXDB_URL: http://localhost:8086
      INFLUXDB_TOKEN: ewcontrol-ci-admin-token
      INFLUXDB_ORG: ewcontrol
      INFLUXDB_BUCKET: signals_history
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: alerts@ewcontrol.local
      # Valores CI-only, sin uso fuera de este workflow — definidos como GitHub
      # Actions Variables (Settings > Secrets and variables > Actions > Variables),
      # no Secrets: los Secrets no se pasan a runs de pull_request abiertos por
      # Dependabot, y estos valores no protegen nada real (solo firman JWTs
      # contra Postgres/InfluxDB efímeros que el job destruye al terminar).
      JWT_ACCESS_SECRET: ${{ vars.CI_JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ vars.CI_JWT_REFRESH_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run migration:run
      - run: pnpm run test:integration
      - run: pnpm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run stylelint
      - run: pnpm run test
      - run: pnpm run build
