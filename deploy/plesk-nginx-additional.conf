# Pegar en Plesk: Sitios web y dominios > tudominio.com > Apache y nginx >
# "Directivas adicionales de nginx" (se aplica dentro del bloque `server {}` del dominio,
# que ya tiene TLS terminado por el Let's Encrypt de Plesk).
#
# Requiere que docker-compose.prod.yml esté levantado en el mismo VPS con:
#   backend  escuchando en 127.0.0.1:3000
#   frontend escuchando en 127.0.0.1:8080

# REST API y WebSocket (namespace api/v1/realtime) -> contenedor backend
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

# Resto de rutas (Angular estático) -> contenedor frontend
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
