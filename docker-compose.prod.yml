services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - backend/.env.production.local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [ewcontrol]

  influxdb:
    image: influxdb:2.7-alpine
    env_file:
      - backend/.env.production.local
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    ports:
      - "127.0.0.1:8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [ewcontrol]

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: production
    env_file:
      - backend/.env.production.local
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    networks: [ewcontrol]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: production
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks: [ewcontrol]

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:

networks:
  ewcontrol:
    driver: bridge
