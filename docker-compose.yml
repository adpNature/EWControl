services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ewcontrol]

  influxdb:
    image: influxdb:2.7-alpine
    env_file:
      - backend/.env
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ewcontrol]

  mailpit:
    # Captura de correo de desarrollo/test para el Notification Service
    # (docs/specs/09-alarmas.md): UI web en 8025, SMTP en 1025. La imagen trae
    # su propio HEALTHCHECK incorporado, sin necesidad de definir uno aquí.
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks: [ewcontrol]

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: development
    env_file:
      - backend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    healthcheck:
      # node:20-alpine (BusyBox) trae wget, no curl (docs/specs/15-observabilidad-tecnica.md).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      influxdb:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks: [ewcontrol]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks: [ewcontrol]

  # Observabilidad técnica (docs/07-observabilidad-monitorizacion.md;
  # docs/specs/15-observabilidad-tecnica.md): Prometheus + Grafana + Alertmanager,
  # separados del stack de negocio (postgres/influxdb/backend/frontend).

  postgres-exporter:
    # PostgreSQL no expone /metrics nativo, a diferencia de InfluxDB.
    image: prometheuscommunity/postgres-exporter:v0.15.0
    env_file:
      - backend/.env
    environment:
      DATA_SOURCE_NAME: "postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ewcontrol]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/rules:/etc/prometheus/rules
    ports:
      - "9090:9090"
    networks: [ewcontrol]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    networks: [ewcontrol]

  grafana:
    image: grafana/grafana-oss:11.3.0
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      # 3001, no 3000: el backend ya usa 3000 en el host.
      - "3001:3000"
    depends_on:
      - prometheus
    networks: [ewcontrol]

volumes:
  postgres_data:
  influxdb_data:
  influxdb_config:
  backend_node_modules:
  frontend_node_modules:
  grafana_data:

networks:
  ewcontrol:
    driver: bridge
