<div class="box forgot-password-page">
  <h1 class="title-xl">¿Olvidaste tu contraseña?</h1>

  @if (submitted()) {
    <p class="text-body" role="status">{{ confirmationMessage }}</p>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <app-input formControlName="email" label="Email" type="email" [errorMessage]="emailError()" />

      @if (formError()) {
        <p class="form-error" role="alert">{{ formError() }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="submitting()">
        {{ submitting() ? 'Enviando…' : 'Enviar enlace de recuperación' }}
      </button>
    </form>
  }
</div>
