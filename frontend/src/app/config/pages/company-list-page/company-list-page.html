<div class="box company-list-page">
  <div class="company-list-page__header">
    <h1 class="title-xl">Companies</h1>
    @if (canManageCompanies()) {
      <a routerLink="new" class="btn-primary">Nueva Company</a>
    }
  </div>

  <app-table
    [columns]="columns"
    [rows]="companiesState.companies()"
    [rowKey]="rowKey"
    [actionsTemplate]="canManageCompanies() ? actions : undefined"
    emptyMessage="No hay Companies todavía."
  />

  <ng-template #actions let-company>
    <button type="button" class="btn-edit" (click)="editCompany(company)">Editar</button>
    @if (company.isActive) {
      <button type="button" class="btn-danger" (click)="companyToDeactivate.set(company)">
        Dar de baja
      </button>
    } @else {
      <button type="button" class="btn-primary" (click)="reactivate(company)">Reactivar</button>
    }
    <button type="button" class="btn-danger" (click)="companyToPurge.set(company)">
      Eliminar permanentemente
    </button>
  </ng-template>
</div>

<app-confirm-dialog
  [open]="companyToDeactivate() !== null"
  title="Dar de baja Company"
  [message]="
    'Esta acción impedirá el acceso a todos los Users de ' +
    (companyToDeactivate()?.name ?? '') +
    '. ¿Continuar?'
  "
  confirmLabel="Dar de baja"
  (confirmed)="confirmDeactivate()"
  (cancelled)="companyToDeactivate.set(null)"
/>

<app-confirm-dialog
  [open]="companyToPurge() !== null"
  title="Eliminar Company permanentemente"
  [message]="
    'Esto eliminará permanentemente la Company ' +
    (companyToPurge()?.name ?? '') +
    ', sus Users, Machines, Signals y Dashboards. Esta acción no se puede deshacer.'
  "
  confirmLabel="Eliminar permanentemente"
  [confirmText]="companyToPurge()?.name"
  (confirmed)="confirmPurge()"
  (cancelled)="companyToPurge.set(null)"
/>
