<div class="box signal-form-page">
  <h1 class="title-xl">{{ isEditMode ? 'Editar Signal' : 'Nueva Signal' }}</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-input formControlName="name" label="Nombre" [errorMessage]="nameError()" />
    <app-input formControlName="unit" label="Unidad" [errorMessage]="unitError()" />

    <div class="form-field" role="radiogroup" aria-label="Tipo de Signal">
      <label class="form-label">
        <input type="radio" formControlName="signalType" value="DIRECT" />
        Directa (DIRECT)
      </label>
      <label class="form-label">
        <input type="radio" formControlName="signalType" value="FORMULA" />
        Fórmula (FORMULA)
      </label>
    </div>

    @if (!isFormula) {
      <app-input formControlName="variableName" label="Variable" />
    } @else {
      <app-input formControlName="expression" label="Expresión" />
      <app-input
        formControlName="variables"
        label="Variables (separadas por coma)"
        [errorMessage]="variablesFieldError()"
      />
    }

    @if (formError()) {
      <p class="form-error" role="alert">{{ formError() }}</p>
    }

    <button type="submit" class="btn-primary" [disabled]="submitting()">
      {{ submitting() ? 'Guardando…' : 'Guardar' }}
    </button>
  </form>

  @if (isEditMode && currentSignalId; as signalId) {
    <div class="signal-form-page__alarms-header">
      <h2 class="title-lg">Reglas de alarma</h2>
      <a
        [routerLink]="['/config/machines', machineId, 'signals', signalId, 'alarm-definitions', 'new']"
        class="btn-primary"
      >
        Añadir regla
      </a>
    </div>

    <app-table
      [columns]="alarmDefinitionColumns"
      [rows]="alarmDefinitionsState.definitions()"
      [rowKey]="alarmDefinitionRowKey"
      [actionsTemplate]="alarmDefinitionActions"
      emptyMessage="No hay reglas de alarma todavía."
    />

    <ng-template #alarmDefinitionActions let-definition>
      <a
        [routerLink]="[
          '/config/machines',
          machineId,
          'signals',
          signalId,
          'alarm-definitions',
          definition.id,
          'edit',
        ]"
      >
        Editar
      </a>
      @if (definition.isActive) {
        <button type="button" class="btn-danger" (click)="alarmDefinitionToDeactivate.set(definition)">
          Desactivar
        </button>
      }
    </ng-template>
  }
</div>

<app-confirm-dialog
  [open]="alarmDefinitionToDeactivate() !== null"
  title="Desactivar regla de alarma"
  message="La regla dejará de evaluarse; su histórico de alarmas anterior se conserva. ¿Continuar?"
  (confirmed)="confirmDeactivateAlarmDefinition()"
  (cancelled)="alarmDefinitionToDeactivate.set(null)"
/>
