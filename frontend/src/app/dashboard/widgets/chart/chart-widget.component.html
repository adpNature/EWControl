<div class="box widget">
  <p class="text-body widget__label">{{ signalRef?.name }}</p>
  @if (points().length > 0) {
    <svg class="chart" viewBox="0 0 100 40" preserveAspectRatio="none" role="img" [attr.aria-label]="config.yAxisLabel ?? signalRef?.name">
      <path [attr.d]="pathD" fill="none" stroke="var(--primary-color)" stroke-width="1.5" vector-effect="non-scaling-stroke" />
    </svg>
    <p class="widget__value">{{ formattedLatestValue }} <span class="text-muted">{{ signalRef?.unit }}</span></p>
    @if (latestQuality(); as quality) {
      <app-signal-quality-badge [quality]="quality" />
    }
  } @else {
    <p class="text-muted">Sin datos disponibles</p>
  }
</div>
