@if (open) {
  <div class="confirm-dialog-backdrop" (click)="onBackdropClick()">
    <div
      #dialog
      class="confirm-dialog box"
      role="alertdialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="messageId"
      tabindex="-1"
      (click)="$event.stopPropagation()"
    >
      <h2 [id]="titleId" class="title-lg">{{ title }}</h2>
      <p [id]="messageId" class="text-body">{{ message }}</p>
      <!-- Contenido adicional opcional, p. ej. la lista de valores de un paquete (spec 20). -->
      <ng-content />
      @if (confirmText !== undefined) {
        <label class="form-label" [for]="confirmInputId"
          >Escribe "{{ confirmText }}" para confirmar</label
        >
        <input
          [id]="confirmInputId"
          class="form-input"
          type="text"
          autocomplete="off"
          [value]="typedValue"
          (input)="onTypedValueInput($any($event.target).value)"
        />
      }
      <div class="confirm-dialog__actions">
        <button type="button" class="btn-secondary" (click)="cancelled.emit()">
          {{ cancelLabel }}
        </button>
        <button
          type="button"
          [class]="danger ? 'btn-danger' : 'btn-primary'"
          [disabled]="isConfirmDisabled"
          (click)="confirmed.emit()"
        >
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
